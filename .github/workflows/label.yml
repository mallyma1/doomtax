# Triages pull requests and applies a label based on the paths modified.
# Config lives in .github/labeler.yml
#
# Trigger is pull_request, not pull_request_target: every PR here comes from a
# branch in this repo, so the default token already has write access, and
# pull_request_target would hand that access to fork PRs for no gain.

name: Labeler
on: [pull_request]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
