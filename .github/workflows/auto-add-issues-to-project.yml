# Adds repository issues to the DoomTax Projects v2 board.
# Mirrors the board's "Auto-add to project" workflow using Actions.
#
# Setup (one-time):
#   1. Create a Personal Access Token (classic) with the "project" scope.
#   2. Save it as repository secret named PAT.
#      (Use PAT exactly; do not use GH_PROJECT_TOKEN.)

name: Auto-add issues to project

on:
  issues:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest

    steps:
      - name: Add issue to Projects v2 board
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/mallyma1/projects/4
          github-token: ${{ secrets.PAT }}
