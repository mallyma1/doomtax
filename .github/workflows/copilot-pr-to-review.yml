# Moves a Copilot-created draft PR into the "Review & Merge" column of your
# GitHub Project as soon as it is opened.
#
# Setup (one-time):
#   1. Create a Personal Access Token (classic) with the "project" scope:
#      github.com → Settings → Developer settings → Personal access tokens →
#      Tokens (classic) → Generate new token → check ✅ project
#   2. Add it as a repository secret named PAT:
#      doomtax → Settings → Secrets and variables → Actions → New repository secret
#      Name:  PAT
#      Value: <your PAT>
#   3. Add the project number as a repository variable (not a secret):
#      same page → Variables → New repository variable
#      Name:  PROJECT_NUMBER
#      Value: the number in your project URL
#             e.g. https://github.com/users/mallyma1/projects/3  →  3
#
# The workflow fires on every newly opened draft PR (which is exactly how the
# Copilot coding agent submits its work).  Non-draft PRs are ignored.

name: Move Copilot draft PR to Review & Merge

on:
  pull_request:
    types: [opened]

jobs:
  move-to-review:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Add PR to project and set status to Review & Merge
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          OWNER: mallyma1
        run: |
          set -euo pipefail

          # ── 1. Resolve the project node ID ─────────────────────────────────
          PROJECT_ID=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) { id }
              }
            }' \
            -f owner="$OWNER" \
            -F number="$PROJECT_NUMBER" \
            --jq '.data.user.projectV2.id')

          echo "Project ID: $PROJECT_ID"

          # ── 2. Add the PR to the project ────────────────────────────────────
          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $pr: ID!) {
              addProjectV2ItemById(input: { projectId: $project, contentId: $pr }) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f pr="$PR_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          echo "Item ID: $ITEM_ID"

          # ── 3. Find the Status field and the "Review & Merge" option ────────
          STATUS_INFO=$(gh api graphql -f query='
            query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f project="$PROJECT_ID")

          FIELD_ID=$(echo "$STATUS_INFO" | \
            jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .id')

          OPTION_ID=$(echo "$STATUS_INFO" | \
            jq -r '.data.node.fields.nodes[] | select(.name == "Status")
                   | .options[] | select(.name == "Review & Merge") | .id')

          echo "Status field: $FIELD_ID  option: $OPTION_ID"

          if [[ -z "$FIELD_ID" || -z "$OPTION_ID" ]]; then
            echo "::warning::Could not find Status field or 'Review & Merge' option. Check project column names."
            exit 0
          fi

          # ── 4. Set the status ───────────────────────────────────────────────
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId:    $item
                fieldId:   $field
                value:     { singleSelectOptionId: $option }
              }) {
                projectV2Item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$FIELD_ID" \
            -f option="$OPTION_ID"

          echo "Done: PR moved to Review & Merge."
