<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- World globe mark: circle with horizontal ellipse grid lines -->
  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Equator ellipse -->
  <ellipse cx="12" cy="12" rx="10" ry="4" stroke="currentColor" stroke-width="1" fill="none"/>
  <!-- Upper latitude hint -->
  <path d="M4.5 8.5 Q12 6.5 19.5 8.5" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Lower latitude hint -->
  <path d="M4.5 15.5 Q12 17.5 19.5 15.5" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Vertical meridian -->
  <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
</svg>
