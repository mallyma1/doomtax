<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600">
  <!-- Background -->
  <rect width="360" height="600" fill="#08070a" rx="12"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="360" height="52" fill="#131218" rx="12"/>
  <rect x="0" y="40" width="360" height="12" fill="#131218"/>

  <!-- DoomTax wordmark row -->
  <circle cx="20" cy="26" r="4" fill="#f59e0b"/>
  <text x="30" y="31" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#f7f5f3">DoomTax</text>
  <!-- testnet pill -->
  <rect x="215" y="18" width="50" height="16" fill="none" stroke="#262430" stroke-width="1" rx="8"/>
  <text x="240" y="30" font-family="ui-monospace, monospace" font-size="8" fill="#635d6c" text-anchor="middle" letter-spacing="1">testnet</text>
  <!-- 文A language button -->
  <text x="280" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#9b95a3">文A</text>
  <!-- About link -->
  <text x="305" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#9b95a3">About</text>

  <!-- Divider -->
  <rect x="0" y="52" width="360" height="1" fill="#262430"/>

  <!-- Live intention card -->
  <rect x="16" y="68" width="328" height="56" fill="#131218" rx="12" stroke="#262430" stroke-width="1"/>
  <!-- Card top glow -->
  <rect x="16" y="68" width="328" height="1" fill="rgba(255,255,255,0.04)" rx="1"/>
  <text x="28" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#f7f5f3">Finish the settlement agent and get one</text>
  <text x="28" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#f7f5f3">payout working end to end</text>

  <!-- Countdown ring area -->
  <circle cx="180" cy="230" r="72" fill="none" stroke="#262430" stroke-width="6"/>
  <circle cx="180" cy="230" r="72" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="317" stroke-dashoffset="80" stroke-linecap="round" transform="rotate(-90 180 230)" opacity="0.9"/>
  <!-- Ring glow -->
  <circle cx="180" cy="230" r="72" fill="none" stroke="#f59e0b" stroke-width="12" opacity="0.08" stroke-dasharray="317" stroke-dashoffset="80" stroke-linecap="round" transform="rotate(-90 180 230)"/>

  <!-- Time display -->
  <text x="180" y="218" font-family="ui-monospace, monospace" font-size="32" font-weight="600" fill="#f7f5f3" text-anchor="middle">08:42</text>
  <text x="180" y="240" font-family="ui-monospace, monospace" font-size="10" fill="#9b95a3" text-anchor="middle">of 25 minutes</text>

  <!-- Milestone copy -->
  <text x="180" y="330" font-family="ui-monospace, monospace" font-size="9" fill="#9b95a3" text-anchor="middle" letter-spacing="1.5">HALFWAY — HOLD THE LINE.</text>

  <!-- Stake badge row -->
  <rect x="78" y="348" width="130" height="28" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1" rx="14"/>
  <circle cx="91" cy="362" r="4" fill="#f59e0b"/>
  <text x="101" y="367" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#f59e0b">5 ℏ at stake</text>
  <text x="220" y="367" font-family="ui-monospace, monospace" font-size="9" fill="#635d6c">no interruptions</text>

  <!-- USD hint -->
  <text x="180" y="392" font-family="ui-monospace, monospace" font-size="9" fill="#635d6c" text-anchor="middle">≈ $0.31</text>

  <!-- CTA buttons -->
  <rect x="16" y="408" width="328" height="44" fill="#f59e0b" rx="22"/>
  <text x="180" y="435" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#08070a" text-anchor="middle">Finish early</text>

  <text x="180" y="476" font-family="system-ui, sans-serif" font-size="11" fill="#635d6c" text-anchor="middle" text-decoration="underline">Disarm this session</text>

  <!-- Partner pills footer -->
  <g transform="translate(0 516)">
    <!-- Hedera pill -->
    <rect x="28" y="0" width="88" height="30" fill="#131218" stroke="#262430" stroke-width="1" rx="15"/>
    <text x="72" y="19" font-family="system-ui, sans-serif" font-size="10" fill="#f7f5f3" text-anchor="middle">Hedera</text>
    <!-- 0G pill -->
    <rect x="126" y="0" width="72" height="30" fill="#131218" stroke="#262430" stroke-width="1" rx="15"/>
    <text x="162" y="19" font-family="system-ui, sans-serif" font-size="10" fill="#f7f5f3" text-anchor="middle">0G</text>
    <!-- World pill (active/glowing) -->
    <rect x="208" y="0" width="80" height="30" fill="#131218" stroke="rgba(245,158,11,0.45)" stroke-width="1" rx="15" filter="url(#glow)"/>
    <text x="248" y="19" font-family="system-ui, sans-serif" font-size="10" fill="#f7f5f3" text-anchor="middle">World</text>
  </g>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
