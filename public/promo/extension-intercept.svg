<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: blurred doomscroll feed mock -->
  <rect width="800" height="500" fill="#0e0d12"/>

  <!-- Fake feed cards (blurred/dimmed) -->
  <g opacity="0.25">
    <!-- Browser chrome hint -->
    <rect x="0" y="0" width="800" height="36" fill="#1c1a22"/>
    <circle cx="20" cy="18" r="6" fill="#fb7185"/>
    <circle cx="40" cy="18" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="18" r="6" fill="#4ade80"/>
    <rect x="120" y="10" width="440" height="16" fill="#131218" rx="4"/>
    <text x="340" y="23" font-family="system-ui, sans-serif" font-size="10" fill="#635d6c" text-anchor="middle">scrolling...</text>

    <!-- Feed card 1 -->
    <rect x="60" y="60" width="680" height="80" fill="#131218" rx="8"/>
    <circle cx="88" cy="88" r="16" fill="#262430"/>
    <rect x="116" y="76" width="200" height="10" fill="#262430" rx="3"/>
    <rect x="116" y="94" width="440" height="8" fill="#1c1a22" rx="2"/>
    <rect x="116" y="108" width="320" height="8" fill="#1c1a22" rx="2"/>

    <!-- Feed card 2 -->
    <rect x="60" y="152" width="680" height="100" fill="#131218" rx="8"/>
    <rect x="76" y="168" width="648" height="12" fill="#262430" rx="3"/>
    <rect x="76" y="188" width="560" height="8" fill="#1c1a22" rx="2"/>
    <rect x="76" y="204" width="480" height="8" fill="#1c1a22" rx="2"/>
    <rect x="76" y="220" width="380" height="8" fill="#1c1a22" rx="2"/>

    <!-- Feed card 3 -->
    <rect x="60" y="264" width="680" height="80" fill="#131218" rx="8"/>
    <circle cx="88" cy="292" r="16" fill="#262430"/>
    <rect x="116" y="280" width="180" height="10" fill="#262430" rx="3"/>
    <rect x="116" y="298" width="400" height="8" fill="#1c1a22" rx="2"/>
    <rect x="116" y="312" width="300" height="8" fill="#1c1a22" rx="2"/>

    <!-- Feed card 4 -->
    <rect x="60" y="356" width="680" height="80" fill="#131218" rx="8"/>
    <rect x="76" y="372" width="648" height="14" fill="#262430" rx="3"/>
    <rect x="76" y="394" width="500" height="8" fill="#1c1a22" rx="2"/>
    <rect x="76" y="410" width="420" height="8" fill="#1c1a22" rx="2"/>
  </g>

  <!-- Overlay backdrop (darkened centre) -->
  <rect width="800" height="500" fill="rgba(8,7,10,0.6)"/>

  <!-- DoomTax overlay card — centred -->
  <rect x="200" y="120" width="400" height="260" fill="#131218" stroke="#262430" stroke-width="1" rx="20"/>
  <!-- Card glow top edge -->
  <rect x="200" y="120" width="400" height="1" fill="rgba(255,255,255,0.06)" rx="1"/>
  <!-- Ambient amber glow behind card -->
  <ellipse cx="400" cy="245" rx="180" ry="100" fill="rgba(245,158,11,0.04)"/>

  <!-- Amber dot + wordmark -->
  <circle cx="225" cy="152" r="5" fill="#f59e0b"/>
  <text x="236" y="157" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#f7f5f3">DoomTax</text>

  <!-- Main message -->
  <text x="400" y="202" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#f7f5f3" text-anchor="middle">You're 12 minutes into</text>
  <text x="400" y="224" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#f7f5f3" text-anchor="middle">a scroll.</text>
  <text x="400" y="253" font-family="system-ui, sans-serif" font-size="13" fill="#9b95a3" text-anchor="middle">Put something behind the next 25?</text>

  <!-- CTA buttons -->
  <rect x="222" y="274" width="164" height="40" fill="#f59e0b" rx="20"/>
  <text x="304" y="299" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#08070a" text-anchor="middle">Start session</text>

  <rect x="398" y="274" width="128" height="40" fill="none" stroke="#262430" stroke-width="1" rx="20"/>
  <text x="462" y="299" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9b95a3" text-anchor="middle">Not now</text>

  <!-- Caption -->
  <text x="400" y="352" font-family="ui-monospace, monospace" font-size="9" fill="#635d6c" text-anchor="middle" letter-spacing="0.5">foreground time is the only signal we read</text>
</svg>
